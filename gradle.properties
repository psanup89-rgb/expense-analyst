# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Build cache is disabled to prevent KSP from serving stale outputs when :domain
# gets new classes. KSP tasks are also individually marked non-cacheable in
# build.gradle.kts. If you re-enable caching, run with --no-build-cache after
# adding any new interface/class to :domain.
org.gradle.caching=false

# KSP: incremental processing is DISABLED.
# Incremental KSP caches symbol tables per module. In a multi-module Hilt project,
# adding a new @Inject class or domain interface causes stale cross-module symbol
# errors ("could not be resolved", PROCESSING_ERROR) on the next build without a clean.
# Full reprocessing is ~2-3s slower per build but eliminates false KSP failures.
ksp.incremental=false

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Non-transitive R classes (improves build speed)
android.nonTransitiveRClass=true

# Compatibility flags for AGP 9.x + Kotlin plugin 2.1.x.
# These show deprecation warnings but are REQUIRED — removing them causes build failures:
#   android.builtInKotlin=false   → prevents AGP from applying Kotlin internally (conflicts with explicit kotlin.android plugin)
#   android.newDsl=false          → keeps AGP on old DSL; new DSL breaks Kotlin plugin's BaseExtension cast
# Do NOT remove these until upgrading to a Kotlin plugin version that supports AGP 9 new DSL.
android.builtInKotlin=false
android.newDsl=false
